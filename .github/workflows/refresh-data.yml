# Daily check for new or revised Census Building Permits Survey county files (and new
# population vintages). Census posts county files on a schedule that shifts month to
# month, so nothing here assumes a release date: every run compares the live Census
# directory listings with data/raw/manifest.json.
#
#   nothing new      -> exits successfully, commits nothing, dashboard unchanged
#   new/revised data -> download, rebuild, validate; only if validation passes:
#                       commit raw files + manifest + release record, then deploy
#   any failure      -> job fails (GitHub emails the repository owner), nothing is
#                       committed, the live dashboard keeps the last good dataset
name: Refresh Census data

on:
  schedule:
    - cron: "23 13 * * *" # daily 13:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-validate even if no Census file changed"
        type: boolean
        default: false
      backfill_from:
        description: "Re-download and re-verify every source file from this year on (blank = new/changed only)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.refresh.outputs.publish }}
      changed: ${{ steps.refresh.outputs.changed }}
      version: ${{ steps.refresh.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore parse cache
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: parse-cache-${{ hashFiles('data/raw/manifest.json') }}
          restore-keys: parse-cache-

      - name: Check Census, download new/revised files, build and validate
        id: refresh
        env:
          PYTHONPATH: scripts
          FORCE: ${{ inputs.force }}
          BACKFILL: ${{ inputs.backfill_from }}
        run: |
          args=()
          if [ "${FORCE}" = "true" ]; then args+=(--force); fi
          if [ -n "${BACKFILL}" ]; then args+=(--backfill-from "${BACKFILL}"); fi
          python -m bpsdash refresh --report refresh-report.json "${args[@]}"

      - name: Run pipeline tests on the new data
        if: steps.refresh.outputs.publish == 'true'
        env:
          PYTHONPATH: scripts
        run: python -m pytest

      - name: Upload refresh report (every attempt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report-${{ github.run_id }}
          path: refresh-report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit raw files, manifest and release record
        if: steps.refresh.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.refresh.outputs.version }}
          OUTCOME: ${{ steps.refresh.outputs.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/geography data/releases data/logs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "${OUTCOME}" = "published" ]; then msg="data: publish ${VERSION}"; else msg="data: record source metadata"; fi
          git commit -m "${msg}"
          git push

  deploy:
    needs: refresh
    if: needs.refresh.outputs.publish == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
